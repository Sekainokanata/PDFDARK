<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <!-- モバイル等でのページズームを抑止し、内部ズームに一本化 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>シロクロクローバ</title>
  <!--<link rel="stylesheet" href="viewer.css">-->
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  
  <div id="container">Loading PDF…</div>

  <!-- 1) pdf.js 本体（UMDビルドならこれで global pdfjsLib が定義される） -->
  <script src="pdfjs/pdf.js"></script>

  <!-- OpenCV.js はサンドボックス iframe 側で読み込みます（拡張ページでは読み込まない） -->

  <!-- 2) 分割した viewer スクリプト群（依存順に読み込み） -->
  <!-- [1. UI・画面構築] -->
  <script src="viewer/UI/uiElements.js"></script>      <!-- UI要素作成関数 -->
  <script src="viewer/UI/shell.js"></script>           <!-- DOM 構築（setupShell） -->

  <!-- [2. ツールバー・操作系] -->
  <script src="viewer/toolbar+ctrl/scroll.js"></script>     <!-- スクロール制御 -->
  <script src="viewer/toolbar+ctrl/zoom.js"></script>       <!-- ズーム制御 -->
  <script src="viewer/toolbar+ctrl/text-mode.js"></script>  <!-- テキスト表示モード切替 -->
  <script src="viewer/toolbar+ctrl/toolbar.js"></script>    <!-- ツールバー統括・ページナビ -->

  <!-- [3. ページレンダリング系（中核）] -->
  <script src="viewer/page_rendering/rendering_function/svg-invert.js"></script>      <!-- SVG 色反転 -->
  <script src="viewer/page_rendering/rendering_function/image-process.js"></script>   <!-- 画像処理・写真領域検出 -->
  <script src="viewer/page_rendering/rendering_function/text-layer.js"></script>      <!-- テキストレイヤ生成 -->
  <script src="viewer/page_rendering/rendering_function/highlight.js"></script>       <!-- ハイライト色変換 -->
  <script src="viewer/page_rendering/page-render.js"></script>     <!-- 個別ページレンダリング -->

  <!-- [4. グローバル機能・ユーティリティ] -->
  <script src="viewer/Utility/darkmode.js"></script>    <!-- ダークモード状態・適用 -->
  <script src="viewer/Utility/download.js"></script>    <!-- ダウンロード処理 -->
  <script src="viewer/Utility/copy-control.js"></script>    <!-- コピー権限制御 -->
  <script src="viewer/main.js"></script>            <!-- エントリーポイント（startViewer） -->

  <!-- 3) viewer-run.js: workerSrc 設定 & startViewer 実行（従来通り） -->
  <script src="viewer-run.js"></script>
</body>
</html>
